<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SexVideoCall - পোস্ট</title>
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #1a0033, #330066); color: #fff; margin: 0; padding: 0; }
        .container { max-width: 800px; margin: 15px auto; background: rgba(0,0,0,0.95); border-radius: 20px; overflow: hidden; }
        .tabs { display: flex; background: #220033; }
        .tab { flex: 1; padding: 16px; text-align: center; cursor: pointer; font-weight: bold; }
        .tab.active { background: #ff00aa; color: white; }
        .content { padding: 20px; display: none; }
        .content.active { display: block; }

        .post-box {
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid #ff00aa;
        }
        .feed {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .post {
            background: rgba(0,0,0,0.8);
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #ff00aa;
        }
        .post img { width: 100%; height: 420px; object-fit: cover; }
        .caption {
            padding: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align:center; color:#ff00aa; padding:15px;">SexVideoCall</h1>

        <div class="tabs">
            <div class="tab active" onclick="showTab(0)">📸 পোস্ট করুন</div>
        </div>

        <div class="content active" id="tab0">
            <!-- পোস্ট তৈরি -->
            <div class="post-box">
                <h2>নতুন পোস্ট করুন</h2>
                <input type="file" id="postImage" accept="image/*" style="margin:10px 0;">
                <input type="text" id="postCaption" placeholder="ক্যাপশন লিখুন... (ডার্টি ক্যাপশন দিতে পারেন)" style="width:100%; padding:12px; margin:10px 0; border-radius:8px;">
                <button onclick="createPost()" style="background:#ff00aa; padding:12px 30px; width:100%; border:none; border-radius:10px; font-size:18px;">পোস্ট করুন 🔥</button>
            </div>

            <!-- ফিড -->
            <h2 style="margin:20px 0 10px;">📌 সব পোস্ট</h2>
            <div class="feed" id="feed"></div>
        </div>
    </div>

    <script>
        let posts = JSON.parse(localStorage.getItem('userPosts')) || [];

        function createPost() {
            const fileInput = document.getElementById('postImage');
            const caption = document.getElementById('postCaption').value.trim() || "হট পোস্ট 🔥";

            if (!fileInput.files[0]) {
                alert("ছবি সিলেক্ট করুন");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                posts.unshift({
                    image: e.target.result,
                    caption: caption,
                    time: new Date().toLocaleTimeString('bn-BD')
                });
                localStorage.setItem('userPosts', JSON.stringify(posts));
                loadFeed();
                fileInput.value = '';
                document.getElementById('postCaption').value = '';
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function loadFeed() {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';

            posts.forEach(post => {
                const div = document.createElement('div');
                div.className = 'post';
                div.innerHTML = `
                    <img src="${post.image}">
                    <div class="caption">${post.caption}</div>
                    <small style="padding:0 15px 10px; display:block; color:#aaa;">${post.time}</small>
                `;
                feed.appendChild(div);
            });
        }

        // প্রথমবার লোড
        window.onload = loadFeed;
    </script>
</body>
</html>
