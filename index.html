<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SexVideoCall - হট গ্যালারি</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a0033, #330066);
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .timer {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #ff00aa;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid #ff66cc;
        }
        h1 { text-align: center; color: #ff00aa; margin: 10px 0 20px; }
        
        .upload-area {
            text-align: center;
            padding: 25px;
            border: 3px dashed #ff00aa;
            border-radius: 15px;
            margin-bottom: 30px;
            background: rgba(0,0,0,0.6);
        }
        input[type="file"] { display: none; }
        .upload-btn {
            background: #ff00aa;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: rgba(0,0,0,0.8);
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #ff00aa;
            position: relative;
        }
        .card:hover { transform: scale(1.05); }
        img {
            width: 100%;
            height: 420px;
            object-fit: cover;
        }
        .title {
            padding: 12px;
            text-align: center;
            font-weight: bold;
            color: #ff99cc;
            background: rgba(0,0,0,0.7);
        }
        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff0000;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="timer" id="timer">অ্যাপে সময়: <span id="time">0</span> মিনিট</div>
    
    <h1>🔥 বাংলাদেশী হট সেক্সি গ্যালারি 🔥</h1>

    <div class="upload-area">
        <h2>নতুন ছবি আপলোড করুন</h2>
        <input type="file" id="imageUpload" accept="image/*">
        <label for="imageUpload" class="upload-btn">📸 ছবি সিলেক্ট করুন</label><br><br>
        <input type="text" id="imageTitle" placeholder="ছবির টাইটেল লিখুন" style="width:80%; padding:12px; border-radius:8px;">
    </div>

    <div class="gallery" id="gallery"></div>

    <script>
        const gallery = document.getElementById('gallery');
        let images = JSON.parse(localStorage.getItem('galleryImages')) || [];
        let minutes = 0;
        const timerDisplay = document.getElementById('time');

        // টাইমার
        setInterval(() => {
            minutes++;
            timerDisplay.textContent = minutes;
        }, 60000);

        function loadGallery() {
            gallery.innerHTML = '';
            images.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="\( {item.src}" alt=" \){item.title}">
                    <button class="delete-btn" onclick="deleteImage(${index})">🗑</button>
                    <div class="title">${item.title || 'হট সেক্সি'}</div>
                `;
                gallery.appendChild(card);
            });
        }

        // আপলোড
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const files = e.target.files;
            const title = document.getElementById('imageTitle').value.trim() || "হট সেক্সি";

            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    images.push({ src: event.target.result, title: title });
                    localStorage.setItem('galleryImages', JSON.stringify(images));
                    loadGallery();
                };
                reader.readAsDataURL(file);
            }
            document.getElementById('imageTitle').value = '';
        });

        window.deleteImage = function(index) {
            if(confirm("ছবিটি ডিলিট করবেন?")) {
                images.splice(index, 1);
                localStorage.setItem('galleryImages', JSON.stringify(images));
                loadGallery();
            }
        };

        loadGallery();
    </script>
</body>
</html>
