<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>❤️ প্রেমের জিগস পাজল ❤️</title>
<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        color: white;
        text-align: center;
        padding: 20px;
    }
    h1 {
        color: #fff;
        text-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
    }
    .container {
        max-width: 1000px;
        margin: 0 auto;
    }
    #uploadArea {
        border: 3px dashed white;
        padding: 40px;
        margin: 20px auto;
        border-radius: 20px;
        cursor: pointer;
        background: rgba(255,255,255,0.1);
    }
    #gameArea {
        display: none;
        margin: 20px auto;
    }
    canvas {
        border: 5px solid white;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    button {
        padding: 12px 25px;
        margin: 10px;
        background: #ff4d94;
        color: white;
        border: none;
        border-radius: 50px;
        font-size: 16px;
        cursor: pointer;
    }
    button:hover { background: #ff1a7a; }
    .hearts {
        font-size: 30px;
        animation: float 3s infinite;
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
    }
</style>
</head>
<body>
<div class="container">
    <h1>❤️ প্রেমের জিগস পাজল ❤️</h1>
    <p>তোমার প্রিয় ছবি দিয়ে পাজল সাজাও</p>

    <div id="uploadArea">
        <h2>ছবি আপলোড করো</h2>
        <p>ক্লিক করে তোমার গ্যালারি থেকে ছবি সিলেক্ট করো</p>
        <input type="file" id="imageInput" accept="image/*" style="display:none;">
    </div>

    <div id="gameArea">
        <canvas id="puzzleCanvas" width="800" height="600"></canvas><br>
        <button onclick="startNewGame()">নতুন ছবি দিয়ে খেলি</button>
        <button onclick="shufflePieces()">পিসগুলো এলোমেলো করো</button>
    </div>
</div>

<script>
// জিগস পাজল লজিক
let canvas = document.getElementById('puzzleCanvas');
let ctx = canvas.getContext('2d');
let img = new Image();
let pieces = [];
let currentPiece = null;
let gridSize = 4; // 4x4 = 16 pieces (সহজ করতে চাইলে 3 করে দিতে পারো)

document.getElementById('uploadArea').addEventListener('click', () => {
    document.getElementById('imageInput').click();
});

document.getElementById('imageInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
            img.src = event.target.result;
            img.onload = function() {
                document.getElementById('uploadArea').style.display = 'none';
                document.getElementById('gameArea').style.display = 'block';
                initPuzzle();
            };
        };
        reader.readAsDataURL(file);
    }
});

function initPuzzle() {
    const aspectRatio = img.width / img.height;
    canvas.width = 700;
    canvas.height = 700 / aspectRatio;
    
    pieces = [];
    const pieceWidth = canvas.width / gridSize;
    const pieceHeight = canvas.height / gridSize;

    for (let i = 0; i < gridSize; i++) {
        for (let j = 0; j < gridSize; j++) {
            pieces.push({
                x: j * pieceWidth,
                y: i * pieceHeight,
                correctX: j * pieceWidth,
                correctY: i * pieceHeight,
                width: pieceWidth,
                height: pieceHeight,
                offsetX: 0,
                offsetY: 0
            });
        }
    }
    shufflePieces();
    draw();
}

function shufflePieces() {
    pieces.sort(() => Math.random() - 0.5);
    const pieceWidth = canvas.width / gridSize;
    const pieceHeight = canvas.height / gridSize;
    
    pieces.forEach((piece, index) => {
        const row = Math.floor(index / gridSize);
        const col = index % gridSize;
        piece.x = col * pieceWidth + (Math.random() * 200 - 100);
        piece.y = row * pieceHeight + (Math.random() * 200 - 100);
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Background hearts effect
    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.font = '30px Arial';
    ctx.fillText('❤️', 50, 80);
    ctx.fillText('💕', canvas.width-100, 120);
    
    pieces.forEach(piece => {
        ctx.save();
        ctx.drawImage(
            img,
            piece.correctX, piece.correctY, piece.width, piece.height,
            piece.x, piece.y, piece.width, piece.height
        );
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 3;
        ctx.strokeRect(piece.x, piece.y, piece.width, piece.height);
        ctx.restore();
    });
}

// Mouse events
canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    
    for (let i = pieces.length - 1; i >= 0; i--) {
        const p = pieces[i];
        if (mouseX > p.x && mouseX < p.x + p.width &&
            mouseY > p.y && mouseY < p.y + p.height) {
            currentPiece = p;
            p.offsetX = mouseX - p.x;
            p.offsetY = mouseY - p.y;
            // Bring to front
            pieces.splice(i, 1);
            pieces.push(p);
            break;
        }
    }
});

canvas.addEventListener('mousemove', (e) => {
    if (!currentPiece) return;
    const rect = canvas.getBoundingClientRect();
    currentPiece.x = e.clientX - rect.left - currentPiece.offsetX;
    currentPiece.y = e.clientY - rect.top - currentPiece.offsetY;
    draw();
});

canvas.addEventListener('mouseup', () => {
    if (!currentPiece) return;
    
    // Snap to correct position if close
    const snapRange = 30;
    if (Math.abs(currentPiece.x - currentPiece.correctX) < snapRange &&
        Math.abs(currentPiece.y - currentPiece.correctY) < snapRange) {
        currentPiece.x = currentPiece.correctX;
        currentPiece.y = currentPiece.correctY;
    }
    
    currentPiece = null;
    draw();
    
    // Check if completed
    if (pieces.every(p => p.x === p.correctX && p.y === p.correctY)) {
        setTimeout(() => {
            alert("🎉 অসাধারণ! তুমি পাজলটা সম্পূর্ণ করেছো!\n❤️ তোমার প্রেম সুন্দর হোক ❤️");
        }, 200);
    }
});

// Touch support for mobile
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    const mouseEvent = new MouseEvent('mousedown', {
        clientX: touch.clientX,
        clientY: touch.clientY
    });
    canvas.dispatchEvent(mouseEvent);
});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    const mouseEvent = new MouseEvent('mousemove', {
        clientX: touch.clientX,
        clientY: touch.clientY
    });
    canvas.dispatchEvent(mouseEvent);
});

canvas.addEventListener('touchend', () => {
    const mouseEvent = new MouseEvent('mouseup');
    canvas.dispatchEvent(mouseEvent);
});

function startNewGame() {
    document.getElementById('uploadArea').style.display = 'block';
    document.getElementById('gameArea').style.display = 'none';
}
</script>
</body>
</html>
