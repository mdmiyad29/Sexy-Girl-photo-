<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SexVideoCall - হট গ্যালারি</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a0033, #330066);
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; color: #ff00aa; margin: 20px 0 15px; }
        .upload-area {
            text-align: center;
            padding: 20px;
            border: 3px dashed #ff00aa;
            border-radius: 15px;
            margin-bottom: 30px;
            background: rgba(0,0,0,0.5);
        }
        input[type="file"] { display: none; }
        .upload-btn {
            background: #ff00aa;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: rgba(0,0,0,0.8);
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #ff00aa;
            transition: 0.3s;
        }
        .card:hover { transform: scale(1.05); }
        img {
            width: 100%;
            height: 420px;
            object-fit: cover;
        }
        .info {
            padding: 12px;
            text-align: center;
            font-weight: bold;
            color: #ff99cc;
        }
        button { margin: 10px; padding: 10px 20px; }
    </style>
</head>
<body>
    <h1>🔥 বাংলাদেশী হট সেক্সি গ্যালারি 🔥</h1>

    <div class="upload-area">
        <h2>নতুন ছবি আপলোড করুন</h2>
        <input type="file" id="imageUpload" accept="image/*" multiple>
        <label for="imageUpload" class="upload-btn">📸 ছবি সিলেক্ট করুন</label>
    </div>

    <div class="gallery" id="gallery"></div>

    <script>
        const gallery = document.getElementById('gallery');
        let images = JSON.parse(localStorage.getItem('galleryImages')) || [];

        // ডিফল্ট ছবি
        const defaultImages = [
            "https://picsum.photos/id/1015/600/800",
            "https://picsum.photos/id/1027/600/800",
            "https://picsum.photos/id/201/600/800",
            "https://picsum.photos/id/1005/600/800",
            "https://picsum.photos/id/133/600/800"
        ];

        function loadGallery() {
            gallery.innerHTML = '';
            
            // ডিফল্ট + আপলোড করা ছবি
            [...defaultImages, ...images].forEach(src => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${src}" alt="Hot Image">
                    <div class="info">হট সেক্সি</div>
                `;
                gallery.appendChild(card);
            });
        }

        // আপলোড ফাংশন
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const files = e.target.files;
            
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    images.push(event.target.result);
                    localStorage.setItem('galleryImages', JSON.stringify(images));
                    loadGallery();
                };
                reader.readAsDataURL(file);
            }
        });

        // প্রথমবার লোড
        loadGallery();
    </script>
</body>
</html>
