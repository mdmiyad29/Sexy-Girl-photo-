<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Post Feed</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a0033, #330066);
            color:#fff;
            padding:15px;
        }

        .container{
            max-width:800px;
            margin:auto;
            background: rgba(0,0,0,0.95);
            border-radius:20px;
            overflow:hidden;
        }

        h1{
            text-align:center;
            color:#ff00aa;
            padding:18px;
        }

        .content{
            padding:20px;
        }

        .post-box{
            background: rgba(0,0,0,0.7);
            padding:15px;
            border-radius:15px;
            margin-bottom:20px;
            border:1px solid #ff00aa;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:none;
            border-radius:10px;
            outline:none;
        }

        button{
            background:#ff00aa;
            color:white;
            border:none;
            padding:12px;
            width:100%;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
        }

        .feed{
            display:flex;
            flex-direction:column;
            gap:20px;
        }

        .post{
            background: rgba(0,0,0,0.8);
            border-radius:15px;
            overflow:hidden;
            border:2px solid #ff00aa;
        }

        .post img{
            width:100%;
            height:420px;
            object-fit:cover;
        }

        .caption{
            padding:15px;
            font-size:16px;
        }

        .time{
            color:#aaa;
            padding:0 15px 10px;
            display:block;
        }

        .actions{
            display:flex;
            justify-content:space-around;
            border-top:1px solid rgba(255,255,255,0.1);
            padding:12px;
        }

        .action-btn{
            background:none;
            border:none;
            color:white;
            cursor:pointer;
            font-size:16px;
        }

        .liked{
            color:#ff2d75;
        }

        .comment-box{
            padding:10px 15px 15px;
        }

        .comment-input{
            width:100%;
            padding:10px;
            border-radius:10px;
            border:none;
            margin-top:10px;
        }

        .comments{
            margin-top:10px;
        }

        .comment{
            background:#1e1e1e;
            padding:8px 10px;
            border-radius:10px;
            margin-top:8px;
            font-size:14px;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>🔥 Social Feed</h1>

    <div class="content">

        <!-- পোস্ট বক্স -->
        <div class="post-box">

            <h2>নতুন পোস্ট করুন</h2>

            <input type="file" id="postImage" accept="image/*">

            <input type="text" id="postCaption" placeholder="ক্যাপশন লিখুন...">

            <button onclick="createPost()">পোস্ট করুন 🚀</button>

        </div>

        <!-- ফিড -->
        <h2 style="margin-bottom:15px;">📌 সব পোস্ট</h2>

        <div class="feed" id="feed"></div>

    </div>

</div>

<script>

let posts = JSON.parse(localStorage.getItem('userPosts')) || [];

function createPost(){

    const fileInput = document.getElementById('postImage');
    const caption = document.getElementById('postCaption').value.trim() || "নতুন পোস্ট 🔥";

    if(!fileInput.files[0]){
        alert("ছবি সিলেক্ট করুন");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        posts.unshift({
            image: e.target.result,
            caption: caption,
            time: new Date().toLocaleTimeString('bn-BD'),
            likes: 0,
            comments: []
        });

        localStorage.setItem('userPosts', JSON.stringify(posts));

        loadFeed();

        fileInput.value = '';
        document.getElementById('postCaption').value = '';

    };

    reader.readAsDataURL(fileInput.files[0]);

}

function loadFeed(){

    const feed = document.getElementById('feed');

    feed.innerHTML = '';

    posts.forEach((post,index)=>{

        const div = document.createElement('div');

        div.className = 'post';

        div.innerHTML = `

            <img src="${post.image}">

            <div class="caption">${post.caption}</div>

            <small class="time">${post.time}</small>

            <div class="actions">

                <button class="action-btn" onclick="likePost(${index})">
                    ❤️ Like (${post.likes})
                </button>

                <button class="action-btn" onclick="toggleComment(${index})">
                    💬 Comment
                </button>

                <button class="action-btn" onclick="sharePost(${index})">
                    📤 Share
                </button>

            </div>

            <div class="comment-box" id="commentBox${index}" style="display:none;">

                <input type="text"
                class="comment-input"
                id="commentInput${index}"
                placeholder="কমেন্ট লিখুন...">

                <button style="margin-top:10px;"
                onclick="addComment(${index})">
                কমেন্ট করুন
                </button>

                <div class="comments">

                    ${post.comments.map(c=>`
                        <div class="comment">${c}</div>
                    `).join('')}

                </div>

            </div>

        `;

        feed.appendChild(div);

    });

}

function likePost(index){

    posts[index].likes++;

    localStorage.setItem('userPosts', JSON.stringify(posts));

    loadFeed();

}

function toggleComment(index){

    const box = document.getElementById('commentBox'+index);

    if(box.style.display === 'none'){
        box.style.display = 'block';
    }else{
        box.style.display = 'none';
    }

}

function addComment(index){

    const input = document.getElementById('commentInput'+index);

    const text = input.value.trim();

    if(text === ''){
        alert("কমেন্ট লিখুন");
        return;
    }

    posts[index].comments.push(text);

    localStorage.setItem('userPosts', JSON.stringify(posts));

    loadFeed();

}

function sharePost(index){

    const shareText = posts[index].caption;

    if(navigator.share){

        navigator.share({
            title:'Social Feed',
            text:shareText
        });

    }else{

        navigator.clipboard.writeText(shareText);

        alert("পোস্ট কপি হয়েছে");

    }

}

window.onload = loadFeed;

</script>

</body>
</html>
