<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>❤️ হট বাংলাদেশি পাজল গ্যালারি ❤️</title>
<style>
    body { 
        margin:0; padding:20px; 
        background: linear-gradient(135deg, #ff1a66, #ff6699); 
        color:white; 
        font-family:sans-serif; 
        text-align:center; 
    }
    h1 { margin:15px; text-shadow: 0 0 20px white; }
    .gallery { 
        display:grid; 
        grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); 
        gap:15px; 
        max-width:1200px; 
        margin:20px auto; 
    }
    .thumb { 
        border:4px solid white; 
        border-radius:15px; 
        overflow:hidden; 
        cursor:pointer; 
        transition:0.3s; 
    }
    .thumb:hover { 
        transform:scale(1.08); 
        box-shadow:0 0 25px #fff; 
    }
    .thumb img { width:100%; height:240px; object-fit:cover; }
    canvas { 
        border:7px solid white; 
        border-radius:18px; 
        box-shadow:0 15px 40px rgba(0,0,0,0.5); 
    }
    button { 
        padding:12px 28px; 
        margin:10px; 
        background:#ff0066; 
        border:none; 
        border-radius:50px; 
        color:white; 
        font-size:17px; 
        cursor:pointer;
    }
    button:hover { background:#ff3388; }
</style>
</head>
<body>
<h1>❤️ হট বাংলাদেশি জিগস পাজল ❤️</h1>
<p>যেকোনো ছবিতে ক্লিক করে খেলা শুরু করো</p>

<div id="gallery" class="gallery"></div>

<div id="gameArea" style="display:none;">
    <canvas id="puzzleCanvas" width="720" height="620"></canvas><br><br>
    <button onclick="backToGallery()">← গ্যালারিতে ফিরে যাও</button>
    <button onclick="shufflePieces()">🔀 এলোমেলো করো</button>
</div>

<script>
const sampleImages = [
    "https://i.ibb.co/1DbJLKX/IMG-20260522-120401.jpg",
    "https://i.ibb.co/xS3k9VHY/IMG-20260515-072541.jpg",
    "https://i.ibb.co/spgG4Fmz/IMG-20260516-204109.jpg",
    "https://i.ibb.co/ZpLv3pCr/your-image4.jpg",   // এগুলো যদি না চলে তাহলে সঠিক ফাইলনেম দিয়ে আপডেট করব
    "https://i.ibb.co/bjJZz24d/your-image5.jpg",
    "https://i.ibb.co/RTthfLrj/your-image6.jpg",
    "https://i.ibb.co/5xWsn3G2/your-image7.jpg",
    "https://i.ibb.co/DyzyBgR/your-image8.jpg",
    "https://i.ibb.co/Q7NyhCSM/your-image9.jpg",
    "https://i.ibb.co/yBgqvKkJ/your-image10.jpg",
    "https://i.ibb.co/KzxcZQYJ/your-image11.jpg",
    "https://i.ibb.co/mVSyTtSP/your-image12.jpg",
    "https://i.ibb.co/PZjWZKTj/your-image13.jpg",
    "https://i.ibb.co/gcVRzYK/your-image14.jpg",
    "https://i.ibb.co/n8YJvt3T/your-image15.jpg",
    "https://i.ibb.co/DPnYPzpS/your-image16.jpg"
];

let currentImage = new Image();
let canvas = document.getElementById('puzzleCanvas');
let ctx = canvas.getContext('2d');
let pieces = [];
let gridSize = 4;
let currentPiece = null;

function loadGallery() {
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '';
    
    sampleImages.forEach((url, index) => {
        const div = document.createElement('div');
        div.className = 'thumb';
        div.innerHTML = `<img src="\( {url}" onerror="this.src='https://picsum.photos/300/300?random= \){index}'">`;
        div.onclick = () => startGame(url);
        gallery.appendChild(div);
    });
}

function startGame(url) {
    document.getElementById('gallery').style.display = 'none';
    document.getElementById('gameArea').style.display = 'block';
    
    currentImage.src = url;
    currentImage.onload = initPuzzle;
    currentImage.onerror = () => alert("ছবি লোড হচ্ছে না। লিংক আপডেট করতে হতে পারে।");
}

function initPuzzle() {
    const aspect = currentImage.width / currentImage.height;
    canvas.height = Math.floor(720 / aspect);
    
    pieces = [];
    const pw = canvas.width / gridSize;
    const ph = canvas.height / gridSize;

    for (let i = 0; i < gridSize * gridSize; i++) {
        const row = Math.floor(i / gridSize);
        const col = i % gridSize;
        pieces.push({
            correctX: col * pw,
            correctY: row * ph,
            x: Math.random() * (canvas.width - pw),
            y: Math.random() * (canvas.height - ph),
            width: pw,
            height: ph
        });
    }
    draw();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
        ctx.drawImage(currentImage, p.correctX, p.correctY, p.width, p.height, p.x, p.y, p.width, p.height);
        ctx.strokeStyle = "rgba(255,255,255,0.85)";
        ctx.lineWidth = 4;
        ctx.strokeRect(p.x, p.y, p.width, p.height);
    });
}

function shufflePieces() {
    pieces.sort(() => Math.random() - 0.5);
    draw();
}

function backToGallery() {
    document.getElementById('gallery').style.display = 'grid';
    document.getElementById('gameArea').style.display = 'none';
}

// Mouse Drag Logic
canvas.addEventListener('mousedown', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    
    for (let i = pieces.length-1; i >= 0; i--) {
        let p = pieces[i];
        if (mx > p.x && mx < p.x + p.width && my > p.y && my < p.y + p.height) {
            currentPiece = p;
            currentPiece.offsetX = mx - p.x;
            currentPiece.offsetY = my - p.y;
            pieces.splice(i,1);
            pieces.push(p);
            break;
        }
    }
});

canvas.addEventListener('mousemove', e => {
    if (!currentPiece) return;
    const rect = canvas.getBoundingClientRect();
    currentPiece.x = e.clientX - rect.left - currentPiece.offsetX;
    currentPiece.y = e.clientY - rect.top - currentPiece.offsetY;
    draw();
});

canvas.addEventListener('mouseup', () => {
    if (!currentPiece) return;
    
    const snap = 28;
    if (Math.abs(currentPiece.x - currentPiece.correctX) < snap && 
        Math.abs(currentPiece.y - currentPiece.correctY) < snap) {
        currentPiece.x = currentPiece.correctX;
        currentPiece.y = currentPiece.correctY;
    }
    
    currentPiece = null;
    draw();
    
    if (pieces.every(p => Math.abs(p.x - p.correctX) < 8 && Math.abs(p.y - p.correctY) < 8)) {
        setTimeout(() => alert("🎉 অসাধারণ! তুমি পাজলটা সম্পূর্ণ করেছো ❤️"), 200);
    }
});

loadGallery();
</script>
</body>
</html>
