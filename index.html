<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Modern Social App</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#0f0f1a;
    color:white;
    overflow-x:hidden;
}

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop') center/cover;
    opacity:0.18;
    z-index:-2;
    animation:bgZoom 20s infinite alternate;
}

body::after{
    content:'';
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#12001f,#220033,#000814);
    opacity:0.92;
    z-index:-1;
}

@keyframes bgZoom{
    from{transform:scale(1);}
    to{transform:scale(1.1);}
}

.container{
    max-width:850px;
    margin:auto;
    padding:20px;
}

.header{
    text-align:center;
    padding:20px;
    margin-bottom:20px;
    border-radius:24px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.08);
}

.logo{
    font-size:42px;
    font-weight:700;
    background:linear-gradient(90deg,#ff00aa,#8f5cff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    margin-top:8px;
    color:#ccc;
}

.card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:24px;
    padding:20px;
    backdrop-filter:blur(12px);
    margin-bottom:25px;
}

.card h2{
    margin-bottom:15px;
}

input, textarea{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:14px;
    background:#1d1d2d;
    color:white;
    font-size:15px;
}

textarea{
    min-height:110px;
    resize:none;
}

.file-box{
    border:2px dashed #ff00aa;
    padding:18px;
    border-radius:16px;
    margin-top:15px;
    text-align:center;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:16px;
    margin-top:15px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
    background:linear-gradient(90deg,#ff00aa,#8f5cff);
    color:white;
}

button:hover{
    transform:translateY(-2px);
    opacity:0.9;
}

.feed{
    display:flex;
    flex-direction:column;
    gap:25px;
}

.post{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:24px;
    overflow:hidden;
    backdrop-filter:blur(10px);
    animation:fadeIn 0.5s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.post-header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px;
}

.avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    background:linear-gradient(135deg,#ff00aa,#8f5cff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
}

.user-info h3{
    font-size:16px;
}

.user-info p{
    font-size:12px;
    color:#aaa;
}

.post img{
    width:100%;
    max-height:520px;
    object-fit:cover;
}

.caption{
    padding:18px;
    line-height:1.6;
}

.actions{
    display:flex;
    justify-content:space-around;
    padding:16px;
    border-top:1px solid rgba(255,255,255,0.06);
}

.action-btn{
    background:none;
    border:none;
    color:white;
    cursor:pointer;
    font-size:15px;
}

.empty{
    text-align:center;
    color:#aaa;
    padding:40px 0;
}

@media(max-width:600px){
    .logo{
        font-size:32px;
    }

    .container{
        padding:12px;
    }
}
</style>
</head>
<body>

<div class="container">

<div class="header">
    <div class="logo">Modern Social</div>
    <div class="subtitle">Photo Sharing Community</div>
</div>

<div class="card">
    <h2>নতুন পোস্ট করুন</h2>

    <input type="text" id="username" placeholder="আপনার নাম লিখুন">

    <div class="file-box">
        <input type="file" id="postImage" accept="image/*">
    </div>

    <textarea id="caption" placeholder="ক্যাপশন লিখুন..."></textarea>

    <button id="postBtn" type="button">পোস্ট করুন 🚀</button>
</div>

<div class="feed" id="feed"></div>

</div>

<script>
let posts = JSON.parse(localStorage.getItem('modernPosts')) || [];

function savePosts(){
    localStorage.setItem('modernPosts', JSON.stringify(posts));
}

function createPost(){
    const usernameInput = document.getElementById('username');
    const imageInput = document.getElementById('postImage');
    const captionInput = document.getElementById('caption');

    const username = usernameInput.value.trim() || 'Anonymous';
    const caption = captionInput.value.trim() || 'New Post';

    if (!imageInput.files || imageInput.files.length === 0) {
        alert('ছবি সিলেক্ট করুন');
        return;
    }

    const file = imageInput.files[0];

    if (!file.type.startsWith('image/')) {
        alert('শুধু ছবি আপলোড করুন');
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event){
        const post = {
            username: username,
            caption: caption,
            image: event.target.result,
            likes: 0,
            time: new Date().toLocaleString('bn-BD')
        };

        posts.unshift(post);

        try {
            localStorage.setItem('modernPosts', JSON.stringify(posts));
        } catch(err){
            alert('স্টোরেজ সমস্যা হয়েছে');
            console.log(err);
        }

        loadFeed();

        usernameInput.value = '';
        captionInput.value = '';
        imageInput.value = '';

        alert('পোস্ট সফল হয়েছে ✅');
    };

    reader.onerror = function(){
        alert('ছবি লোড করা যায়নি');
    };

    reader.readAsDataURL(file);
}

function likePost(index){
    posts[index].likes++;
    savePosts();
    loadFeed();
}

function deletePost(index){
    if(confirm('পোস্ট ডিলিট করবেন?')){
        posts.splice(index,1);
        savePosts();
        loadFeed();
    }
}

function loadFeed(){
    const feed = document.getElementById('feed');

    if(posts.length===0){
        feed.innerHTML = '<div class="empty">এখনো কোনো পোস্ট নেই</div>';
        return;
    }

    feed.innerHTML='';

    posts.forEach((post,index)=>{

        const div = document.createElement('div');
        div.className='post';

        div.innerHTML=`
        <div class="post-header">
            <div class="avatar">${post.username.charAt(0).toUpperCase()}</div>
            <div class="user-info">
                <h3>${post.username}</h3>
                <p>${post.time}</p>
            </div>
        </div>

        <img src="${post.image}">

        <div class="caption">
            ${post.caption}
        </div>

        <div class="actions">
            <button class="action-btn" onclick="likePost(${index})">❤️ ${post.likes}</button>
            <button class="action-btn" onclick="deletePost(${index})">🗑 Delete</button>
        </div>
        `;

        feed.appendChild(div);
    });
}

window.onload = function(){
    loadFeed();

    const postBtn = document.getElementById('postBtn');

    if(postBtn){
        postBtn.addEventListener('click', createPost);
    }

    console.log('App loaded successfully');
};
</script>

</body>
</html>
